# /etc/NetworkManager/conf.d/dualrm.conf (main tablet)
# dual-rM: leave the USB link to the sub alone (dualrm0, see 10-dualrm-peer.link).
# dualrm-usbrole.sh brings it up with an IPv6 link-local address only. The stock
# unmanaged-devices list (usb0, usb1) in NetworkManager.conf stays as it is.
[device-dualrm]
match-device=interface-name:dualrm0
managed=0
