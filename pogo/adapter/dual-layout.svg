<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="DejaVu Sans, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Planned layout (front view, direct-cable variant)</text>

  <!-- MAIN tablet -->
  <text x="247" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Main (stock)</text>
  <rect x="60" y="90" width="374" height="492" rx="14" fill="#e9e7e2" stroke="#555" stroke-width="2"/>
  <rect x="84" y="114" width="326" height="420" fill="#f7f6f2" stroke="#aaa"/>
  <text x="247" y="320" text-anchor="middle" font-size="18" fill="#888">Document A open</text>
  <!-- main USB-C port + plug -->
  <rect x="88" y="578" width="26" height="8" rx="3" fill="#333"/>
  <rect x="86" y="586" width="30" height="40" rx="5" fill="#555"/>
  <text x="128" y="612" font-size="14" fill="#333">USB-C plug</text>

  <!-- SUB tablet -->
  <text x="767" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Sub (xovi)</text>
  <rect x="580" y="90" width="374" height="492" rx="14" fill="#e9e7e2" stroke="#555" stroke-width="2"/>
  <rect x="604" y="114" width="326" height="420" fill="#f7f6f2" stroke="#aaa"/>
  <text x="767" y="320" text-anchor="middle" font-size="18" fill="#888">Same-named document A opens</text>
  <!-- sub's own USB-C port (stays free) -->
  <rect x="640" y="578" width="26" height="8" rx="3" fill="#333"/>
  <text x="676" y="604" font-size="14" fill="#333">Sub USB-C stays free for a charger</text>

  <!-- sleeve on sub's left edge -->
  <rect x="562" y="84" width="34" height="504" rx="6" fill="#2b2b2b"/>
  <!-- pogo pads location -->
  <g fill="#d4a017"><circle cx="579" cy="520" r="3"/><circle cx="579" cy="530" r="3"/><circle cx="579" cy="540" r="3"/><circle cx="579" cy="550" r="3"/><circle cx="579" cy="560" r="3"/></g>
  <!-- cable from sleeve bottom to main plug -->
  <path d="M 579 588 C 579 690, 101 700, 101 626" fill="none" stroke="#1f6fd1" stroke-width="7" stroke-linecap="round"/>
  <text x="340" y="700" text-anchor="middle" font-size="16" fill="#1f6fd1">USB-A to C cable, A end cut and soldered to the contacts in the sleeve (~30 cm)</text>

  <!-- callout for sleeve -->
  <line x1="562" y1="250" x2="470" y2="250" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="466" y="244" text-anchor="end" font-size="15" fill="#222">3D printed sleeve</text>
  <text x="466" y="264" text-anchor="end" font-size="13" fill="#555">slides onto the sub's left edge</text>
  <line x1="579" y1="540" x2="470" y2="470" stroke="#d4a017" stroke-width="1.5"/>
  <text x="466" y="466" text-anchor="end" font-size="15" fill="#222">5 spring contacts inside</text>
  <text x="466" y="486" text-anchor="end" font-size="13" fill="#555">touch the gold pogo pads</text>

  <!-- cross-section inset -->
  <g transform="translate(980,120)">
    <text x="50" y="0" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Section</text>
    <path d="M 10 20 L 90 20 L 90 40 L 30 40 L 30 120 L 90 120 L 90 140 L 10 140 Z" fill="#2b2b2b"/>
    <rect x="34" y="44" width="70" height="72" fill="#e9e7e2" stroke="#555"/>
    <text x="70" y="85" text-anchor="middle" font-size="11" fill="#555">tablet</text>
    <rect x="30" y="70" width="6" height="20" fill="#d4a017"/>
    <text x="50" y="166" text-anchor="middle" font-size="11" fill="#555">gold = spring contacts</text>
  </g>

  <text x="550" y="742" text-anchor="middle" font-size="14" fill="#666">Open a document on the main and the sub opens the same one · sub battery powers the main · no WiFi needed</text>
</svg>
